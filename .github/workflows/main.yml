name: NixMod CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint configs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell script syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: JSON syntax
        run: git ls-files -z '*.json' | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: TOML syntax
        run: git ls-files -z '*.toml' | xargs -0 -n1 python3 -c 'import sys, tomllib; tomllib.load(open(sys.argv[1], "rb"))'

  nix:
    name: Evaluate NixOS configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Nix syntax
        run: git ls-files -z '*.nix' | xargs -0 -n1 nix-instantiate --parse > /dev/null

      # Evaluates the whole system (all modules, Home Manager, dotfile paths) without building it.
      - name: Evaluate nixosConfigurations.nixos
        run: nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath
