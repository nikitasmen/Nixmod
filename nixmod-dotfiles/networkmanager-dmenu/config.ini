[dmenu]
# Our wrapper (./wofi) relabels the rows, then runs the real wofi. Must be an absolute path
# and keep the basename "wofi" so nmdm still adds --dmenu/-p/-P.
# Dropdown under the top bar's right side, same placement as waybar/scripts/media-menu.sh;
# look comes from ~/.config/wofi/style.css.
dmenu_command = /home/nikmen/.config/networkmanager-dmenu/wofi -i -l top_right -y 40 -x -10 -W 460 -L 16
# The wrapper does the highlighting itself, keyed off this prefix, so leave highlight off
active_chars = ==
highlight = False
compact = False
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
# Parsed by the wrapper: icon¦name¦security¦signal
format = {icon}¦{name}¦{sec}¦{signal}
list_saved = False
prompt = 󰤨 Wi-Fi

[dmenu_passphrase]
# wofi -P: mask the password as it's typed
obscure = True

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = ghostty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
